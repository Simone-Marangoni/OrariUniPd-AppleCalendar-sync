name: Aggiorna calendario OrariUniPD

on:
  schedule:
    # Ogni giorno alle 01:16 UTC (circa le 02:16/03:16 ora italiana)
    - cron: "16 1 * * *"
  workflow_dispatch: {}   # permette anche di lanciarlo a mano dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica ed unisci la settimana target
        run: python fetch_and_publish.py

      - name: Salva il file aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          git diff --staged --quiet || git commit -m "Aggiorna calendario ($(date +'%d-%m-%Y'))"
          git push
