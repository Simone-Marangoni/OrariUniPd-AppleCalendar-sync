name: Aggiorna calendario OrariUniPD

on:
  schedule:
    # Esegui alle 05:15 e 16:15 UTC (circa 07:15 e 18:15 ora italiana)
    # Evita la fascia notturna (01:00-04:00 UTC) soggetta a manutenzione EasyStaff UniPD
    - cron: "15 5,16 * * *"
  workflow_dispatch: {}   # permette anche di lanciarlo a mano dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica ed unisci la settimana target
        run: python fetch_and_publish.py

      - name: Verifica integrità calendario
        run: |
          if [ ! -s docs/calendar.ics ]; then
            echo "Errore: docs/calendar.ics è assente o vuoto!"
            exit 1
          fi
          if ! grep -q "BEGIN:VEVENT" docs/calendar.ics; then
            echo "Errore: docs/calendar.ics non contiene eventi VEVENT!"
            exit 1
          fi

      - name: Salva il file aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          git diff --staged --quiet || git commit -m "Aggiorna calendario ($(date +'%d-%m-%Y'))"
          git push
